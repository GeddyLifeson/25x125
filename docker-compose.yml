# Local database (PostgreSQL 16 with PostGIS 3.4) and the map tile server (Martin).
# Start:  docker compose up -d     Stop: docker compose down
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: x25x125
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d x25x125"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Vector tiles for the map, drawn by the functions in db/migrations/0022_map_tiles.sql.
  # Run python -m db.migrate first. Tiles at http://localhost:3100/catalog
  tiles:
    image: ghcr.io/maplibre/martin:v0.18.1
    command: ["--config", "/config/config.yaml"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/x25x125
    volumes:
      - ./martin:/config:ro
    ports:
      - "3100:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
