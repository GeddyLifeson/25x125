# GitHub Codespaces: the database (PostgreSQL 16 with PostGIS) and the workspace the app runs in. The workspace
# shares the database container's network, so the database is at localhost:5432 as in .env.example.
services:
  db:
    image: postgis/postgis:16-3.4
    # More memory for the restore and the loads than the 128 MB default; the codespace has 8 GB.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "maintenance_work_mem=512MB", "-c", "max_wal_size=4GB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: x25x125
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512mb
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    network_mode: service:db
    volumes:
      - ..:/workspaces/25x125:cached
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/x25x125
      LOCAL_MODE: "1"
      APP_ENV: development
      PYTHONUNBUFFERED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - db
volumes:
  pgdata:
