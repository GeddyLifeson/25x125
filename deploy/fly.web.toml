# Web app (Next.js standalone). The only app on the public internet. It calls the engine and the tile server
# over Fly's private network; the browser only ever talks to this app.
# Deploy: python -m scripts.deploy (runs: fly deploy . --config deploy/fly.web.toml
#         --dockerfile deploy/web.Dockerfile --remote-only)
# Secrets: ENGINE_SHARED_SECRET (same value as the engine), APP_URL, SENTRY_DSN
app = "x25x125-web"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "web.Dockerfile"
  # [build.args] NEXT_PUBLIC_BASEMAP_STYLE = "..." to change the basemap (read at build time).

[deploy]
  strategy = "rolling"

[env]
  APP_ENV = "production"
  NODE_ENV = "production"
  HOSTNAME = "::"
  PORT = "3000"
  ENGINE_URL = "http://x25x125-engine.internal:8080"
  TILES_URL = "http://x25x125-tiles.internal:3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  # Web only (?scope=web): the app answers, without waiting on the engine, so an engine outage
  # doesn't pull the web app out of rotation. UptimeRobot checks /api/health (web, engine and database).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health?scope=web"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
