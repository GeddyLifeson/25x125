[project]
name = "x25x125"
version = "0.1.0"
description = "25x125: Chicago parcel feasibility. Loaders, nightly jobs and the rules and feasibility engine."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "db*", "engine*", "jobs*"]

[tool.setuptools.package-data]
db = ["migrations/*.sql"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["scripts/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
