# The public website (docs/website.md): copies deploy/space into a Hugging Face Space, which builds the app from
# this commit and serves it at https://<hf-user>-25x125.hf.space. Free (CPU basic Space). Needs the repo secret
# HF_TOKEN (a Hugging Face write token); SITE_PASSWORD (repo secret) is the password the site asks for.
name: Website

on:
  push:
    branches: [main, claude/project-thread-nj2iox]
    paths-ignore: ["docs/**", "*.md", "mockups/**", "desktop/**", "site/**"]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - name: Check for the Hugging Face token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::No HF_TOKEN secret yet, so the website was not updated (docs/website.md, step 2)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Send this commit to the Space
        if: steps.token.outputs.ok == 'true'
        run: |
          python -m pip install --quiet huggingface_hub==0.36.0
          python scripts/deploy_space.py --ref "$GITHUB_SHA"
