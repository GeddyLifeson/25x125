name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: x25x125
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check core db engine jobs tests
      - run: python -m db.migrate
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Dependency scanning: Python packages from pyproject.toml (pip-audit) and the web app's npm packages.
  # pip-audit fails the job on any known vulnerability. npm audit fails on critical advisories in runtime
  # packages and lists the rest; on 2026-11-01 maplibre-gl 5.x (critical, fixed in 6.x) and next 15.x
  # (postcss, high) are known and wait on an upgrade, so that step reports instead of failing until then.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (runtime packages)
        working-directory: web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit (all packages, report only)
        working-directory: web
        run: npm audit || echo "::warning::npm audit lists advisories; see the log above"
