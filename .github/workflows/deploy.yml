name: Deploy

# Deploys to Fly.io after CI passes on a push to main (docs/deploy.md). Code only: apps, secrets and the
# first full load are set up once from Marlon's machine with python -m scripts.deploy.
# Without the FLY_API_TOKEN repository secret every step after the check is skipped and the run passes.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the Fly token
        id: token
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set; skipping the deploy. Add it under Settings > Secrets and variables > Actions."
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Deploy engine (runs migrations), tiles, web; move the nightly job to the new image
        if: steps.token.outputs.present == 'true'
        run: python -m scripts.deploy --ci
