<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<title>25x125: status and data loads</title>
<style>
  /* Same colors and type as the app (mockups/*.dc.html). */
  :root { --bg: #f5f6f7; --fg: #16191d; --muted: #5a6169; --line: #dde1e5; --accent: #1c6db0; }
  body { margin: 0; font: 14px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  .bar { display: flex; align-items: baseline; gap: 10px; padding: 14px 24px; background: #16191d; color: #fff; }
  .bar b { font-family: "IBM Plex Mono", Consolas, monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.5px; }
  .bar span { font-size: 12px; color: #b9c0c7; }
  header { margin: 20px 24px 0; padding: 20px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  #status { font-size: 15px; margin: 0 0 8px; }
  .facts { color: var(--muted); font-size: 13px; }
  button { font: inherit; font-weight: 600; height: 44px; padding: 0 18px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer; }
  button.plain { background: #fff; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #log { margin: 12px 24px 20px; height: calc(100vh - 290px); overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.4 "IBM Plex Mono", Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="bar"><b>25x125</b><span>Chicago development pipeline</span></div>
<header>
  <h1>25x125 on this computer</h1>
  <p id="status">Starting...</p>
  <p class="facts" id="facts"></p>
  <button id="open" disabled>Open 25x125</button>
  <button id="logs" class="plain">Open logs folder</button>
</header>
<div id="log" aria-live="polite"></div>
<script src="status.js"></script>
</body>
</html>
